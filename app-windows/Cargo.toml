[package]
name = "pip"
version.workspace = true
edition.workspace = true
description = "Pip — a tiny companion that lives on your Windows desktop."

[[bin]]
name = "pip"
path = "src/main.rs"

[features]
# Developer automation: command channel + PNG snapshots of rendered surfaces. Off in release.
devtools = ["tiny-skia/png-format", "pip-draw/png-format"]

[dependencies]
ab_glyph = "0.2.32"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
pip-core = { path = "../core" }
pip-draw = { path = "../draw" }
serde = "1.0.229"
serde_json = "1.0.151"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Power", "Win32_Media_Audio", "Win32_System_ProcessStatus", "Win32_Graphics_Dwm", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_DataExchange", "Win32_Security", "Win32_System_Console", "Win32_Networking_WinHttp", "Win32_Security_Cryptography", "Win32_System_Ole"] }
