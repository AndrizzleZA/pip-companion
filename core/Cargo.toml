[package]
name = "pip-core"
version.workspace = true
edition.workspace = true
description = "Platform-independent brain of Pip: settings, reminder engine, policy, mood."

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Sync: authenticated encryption + a slow hash for the short pairing code.
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc", "getrandom"] }
# Device-to-device key handover: the new device makes a key pair, the approving device seals
# the sync key to it. Nothing is typed, and the cloud only ever carries sealed bytes.
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets"] }
blake2 = { version = "0.10.6", default-features = false }
