[package]
name = "pip-draw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pip's creature, drawn into a pixel buffer. No operating system in here."

[dependencies]
pip-core = { path = "../core" }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }

[features]
# Lets a caller save what was drawn, for the desktop's snapshot command.
png-format = ["tiny-skia/png-format"]

# Only builds when asked: a plain `cargo test` must not need the PNG encoder to compile an example
# that exists to write PNGs.
[[example]]
name = "shots"
required-features = ["png-format"]
