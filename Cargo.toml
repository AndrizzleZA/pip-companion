[workspace]
resolver = "2"
members = ["core", "app-windows", "app-android/rust"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# Debug info lives in a separate .pdb on MSVC, so keeping it costs the shipped exe nothing
# (measured: 2_118_144 bytes with, 2_118_656 without) and is the difference between a crash
# report naming functions and one listing bare addresses. The .pdb is archived per release,
# never shipped - it is five times the size of Pip itself.
debug = 1
strip = false

# Keep debug builds snappy to run (rendering is per-pixel work) while compiling our own code fast.
[profile.dev.package."*"]
opt-level = 2
