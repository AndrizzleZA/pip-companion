[workspace]
resolver = "2"
members = ["core", "app-windows"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Keep debug builds snappy to run (rendering is per-pixel work) while compiling our own code fast.
[profile.dev.package."*"]
opt-level = 2
