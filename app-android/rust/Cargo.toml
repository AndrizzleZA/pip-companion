[package]
name = "pip-jni"
version.workspace = true
edition.workspace = true
description = "The thin bridge that lets the Android app use Pip's brain: one JNI call, JSON in, JSON out."

[lib]
name = "pipjni"
crate-type = ["cdylib"]

[dependencies]
pip-core = { path = "../../core" }
jni = { version = "0.21.1", default-features = false }
serde = "1.0.229"
serde_json = "1.0.151"
